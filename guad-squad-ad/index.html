<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guad Squad — Agent Assistant Ad</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #070c1c;
      color: #f4f7fb;
      font-family: Arial, Helvetica, sans-serif;
    }
    main { width: min(100%, 460px); padding: 24px 16px; text-align: center; }
    video {
      display: block;
      width: 100%;
      max-height: 86vh;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 14px;
      box-shadow: 0 24px 70px rgba(0,0,0,.5);
    }
    p { margin: 14px 0 0; color: #b9c6e4; font-size: 14px; }
    a { color: #22e6a4; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <video controls playsinline preload="metadata" poster="guad-squad-ad-poster.jpg">
      <source src="guad-squad-ad-15s.mp4" type="video/mp4">
      Your browser does not support MP4 video playback.
    </video>
    <p>Hear the demo Agent Assistant live: <a href="tel:+15856678982">(585) 667-8982</a></p>
  </main>
</body>
</html>
